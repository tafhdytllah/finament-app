# =============================
# Server
# =============================
server:
  port: ${PORT:8080}

spring:
  application:
    name: finament-app

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finament_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect:
          default_param_cast: true
    show-sql: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  level:
    root: INFO
    com.tafh.finament_app: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

security:
  refresh-token-cookie:
    name: ${SECURITY_REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    path: ${SECURITY_REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
    secure: ${SECURITY_REFRESH_TOKEN_COOKIE_SECURE:false}
    http-only: true
    same-site: ${SECURITY_REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:finament-app}
  expiration: ${JWT_EXPIRATION:1h}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:30d}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
